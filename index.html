<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grid Fill</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }

    #divDisplayGrid {
      width: 100vw;
      height: 80vh;
      height: 80dvh;
      overflow: hidden;
      box-sizing: border-box;
      font-family: "Courier New", Courier, monospace;
      color: #ffffff;
      font-size: 8px;
      line-height: 10px;
      white-space: pre;
      border: 3px solid #470202;
    }
  </style>
</head>
<body>
  <div id="divDisplayGrid"></div>
  <button id='btnToggleFire'>Toggle Fire</button>
  <button id='btnToggleWind'>Toggle Wind</button>
  <script type="module" src="grid.js"></script>
</body>
</html>
